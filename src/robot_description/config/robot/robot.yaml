robot:
  body:
    length: 1.0
    width: 0.6
    height: 0.2
    mass: 10.0
  wheels:
    radius: 0.15
    width: 0.08
    mass: 1.0
    x_offset: 0.35
    y_offset: 0.34
    z_offset: -0.1
  actuator:
    torque_constant: 0.02
    gear_ratio: 50.0
    efficiency: 0.8
  tracking_frame:
    parent: wrist_link
    translation:
    - 0.12
    - 0.0
    - 0.0
    rotation_rpy:
    - 0.0
    - 0.0
    - 0.0
  manipulator:
    base:
      radius: 0.1
      height: 0.08
      mass: 1.0
    link1:
      length: 0.4
      width: 0.08
      height: 0.08
      mass: 1.0
    link2:
      length: 0.36
      width: 0.07
      height: 0.07
      mass: 0.8
    wrist:
      length: 0.12
      width: 0.06
      height: 0.06
      mass: 0.4
    joints:
      base_yaw:
        axis:
        - 0.0
        - 0.0
        - 1.0
        lower: -3.14
        upper: 3.14
        effort: 20.0
        velocity: 1.0
        damping: 0.1
      shoulder:
        axis:
        - 0.0
        - -1.0
        - 0.0
        lower: -1.57
        upper: 1.57
        effort: 20.0
        velocity: 1.0
        damping: 0.2
      elbow:
        axis:
        - 0.0
        - -1.0
        - 0.0
        lower: -1.57
        upper: 1.57
        effort: 20.0
        velocity: 1.0
        damping: 0.2
      wrist:
        axis:
        - 0.0
        - -1.0
        - 0.0
        lower: -1.57
        upper: 1.57
        effort: 10.0
        velocity: 1.5
        damping: 0.15
