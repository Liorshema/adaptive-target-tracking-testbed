# One baseline composition; assignments are bounded by the existing comparison policy.
# Internal experiment/variant identities and effective settings match the schema-1 study.
schema_version: 2
experiment:
  name: sensor_noise_comparison
  description: Bounded sensing comparison, not a ranking or identical-trajectory experiment.
  system_config: {package: robot_bringup, path: config/system_manipulation_D_localized.yaml}
  duration: 8.0
  settling_time: 3.0
  seeds: [42]
  variants:
    - name: baseline
      parameters:
        pose_white_noise_std: [0.04, 0.04, 0.03490658503988659]
    - name: higher_noise
      parameters:
        pose_white_noise_std: [0.08, 0.08, 0.06981317007977318]
  comparison:
    schema_version: 1
    domain: sensor_parameters
    variables:
      - name: pose_white_noise_std
        path: localization_sensor.localization_sensor.white_noise_std
        values:
          - [0.04, 0.04, 0.03490658503988659]
          - [0.08, 0.08, 0.06981317007977318]
  metrics: [tracking_distance, pointing_error, prediction_rmse, estimation_error,
            joint_speed_violation, joint_position_violation, realtime_factor, control_compute]
  output:
    directory: results/experiments
  runtime:
    enable_actuation: true
  execution:
    readiness_timeout: 45.0
    stall_timeout: 12.0
    wall_timeout: 150.0
    shutdown_timeout: 5.0
    max_skew: 0.15
    failure_policy: continue
    record_actuator_trace: true
