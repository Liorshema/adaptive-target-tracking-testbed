actuation:
  command_topic: /control/safe_velocity
  rate_hz: 50.0
  command_max_age: 0.25
  feedback_max_age: 0.2
  wall_timeout: 0.5
  future_tolerance: 0.01
  max_position_lead: 0.08
  max_integration_dt: 0.1
  # Physical limits remain in robot_description. All angles below are radians.
  position_recovery:
    numerical_tolerance: 1.0e-9
    recoverable_violation: 0.001
    # Position-reference slew [rad/s], capped by description velocity; not a physical speed bound.
    recovery_speed: 0.1
    # Legal inward reference offset, shared by the configured holding backends.
    # Legacy PID load calculation motivated this value; velocity_servo does not
    # use PID gains. Its effort-bounded motor must physically cross release_margin.
    recovery_inset: 0.06
    release_margin: 0.005
  publish_diagnostics: true
  diagnostic_rate_hz: 10.0
  diagnostic_topic: /simulation/actuation/telemetry
