# Replaces the list: fixed world-center and camera-relative circulation are not
# part of this base-relative experiment. Damping remains in Fight/Flight only.
environment:
  acceleration_fields:
    - type: base_relative_guidance
      enabled: true
      parameters:
        radial_gain: 1.5       # s^-2
        height_gain: 1.5       # s^-2
        radial_epsilon: 0.02   # m
        reference_frame: world
        schedule:
          - name: low_overhead
            duration: 10.0
            transition: 0.0
            values: [0.55, 1.60, 0.0]  # rho[m], height above physical base[m], tangent[m/s²]
          - name: vertical_escape
            duration: 10.0
            transition: 3.0
            values: [0.60, 1.85, 0.0]
          - name: orbit
            duration: 20.0
            transition: 3.0
            values: [1.30, 1.35, 0.30]
  stochastic_disturbances: []
