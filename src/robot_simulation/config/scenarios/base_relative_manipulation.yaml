# Direct saturated Fight/Flight deployment with physical base-relative guidance.
# Owner resources retain their parameters, physical wrist limits and native actuator.
paths:
  base: package
world:
  source: worlds/tracking_testbed.sdf.xacro
  terrain_config: config/terrain/flat.yaml
  output_name: world.sdf
  physics:
    engine: dartsim_recovery
    max_step_size: 0.002
    real_time_factor: 1.0
  system_plugins:
  - filename: gz-sim-physics-system
    name: gz::sim::systems::Physics
  - filename: gz-sim-user-commands-system
    name: gz::sim::systems::UserCommands
  - filename: gz-sim-scene-broadcaster-system
    name: gz::sim::systems::SceneBroadcaster
target:
  config: config/scenarios/target_saturated.yaml
  entity_name: target
  initial_position:
  - 0.5390366178
  - 0.109268132
  - 1.85
  initial_velocity:
  - 0.0
  - 0.0
  - 0.0
robot:
  enabled: true
  config: config/gazebo/robot_wrist15.yaml
  joint_position_hold: config/gazebo/joint_position_hold.yaml
tracking:
  source: tf
  position:
  - 0.0
  - 0.0
  - 1.0
  reference_frame: world
  tracking_frame: tracking_frame
  max_age: 0.3
  future_tolerance: 0.0
  pose_source: physical
simulation:
  config: config/simulation.yaml
  environment_config: config/scenarios/environment_manipulation.yaml
  measurement_config: config/measurements.yaml
gazebo:
  gui: true
  start_running: true
  clock_topic: /clock
  pose_service_template: /world/{world}/set_pose
  pose_service_type: ros_gz_interfaces/srv/SetEntityPose
physical_context:
  base_topic: /simulation/robot/ground_truth
  reference_frame: world
  max_age: 0.3
localization_sensor_config: config/sensors/planar_localization.yaml
