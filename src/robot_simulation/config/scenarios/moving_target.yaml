# Independent target motion: this scenario's dynamics set alpha=0, so the
# static tracking position does not introduce a reaction to robot motion.
extends: ../launch.yaml

paths:
  base: package

target:
  config: config/scenarios/target.yaml
  initial_position: [2.7, 0.0, 0.85]
  initial_velocity: [0.0, 0.35, 0.0]

simulation:
  environment_config: config/scenarios/environment.yaml
