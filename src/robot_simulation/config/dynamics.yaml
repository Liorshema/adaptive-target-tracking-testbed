# Mathematical defaults only; scenario selections and overrides stay external.
# Target state: [position_world (m), velocity_world (m/s)].
# With delta = target - tracking_position_world, d = ||delta||,
# direction = delta / sqrt(d^2 + distance_epsilon^2):
# p_dot = v; v_dot = radial(d)*direction - damping*v + external acceleration.
# Positive radial(d) points away from the tracker; negative points toward it.
dynamics:
  # Generic owner type. Supply a complete parameters.model to replace this
  # reusable constant-velocity definition; no Python registration is needed.
  equation_state_space:
    parameters:
      model:
        id: constant_velocity
        type: equation_state_space
        schema_version: 1
        frame: world
        state:
          - {name: p, shape: [3], unit: m, initial: [0.0, 0.0, 1.0]}
          - {name: v, shape: [3], unit: m/s, initial: [0.0, 0.0, 0.0]}
        parameters: {}
        equations:
          p: v
          v: "[0, 0, 0]"
        deployment: {adapter: cartesian_target, position: p, velocity: v}
  fight_flight:
    parameters:
      # radial(d) = alpha*(d - preferred_distance).
      alpha: 1.0  # s^-2; slope of radial acceleration versus distance
      preferred_distance: 1.0  # m; zero radial interaction, not a hard constraint
      damping: 0.5  # s^-1; velocity-proportional drag
      distance_epsilon: 1.0e-6  # m; smooth direction normalization near coincidence
  saturated_fight_flight:
    parameters:
      # radial(d) = a_max*tanh((d - preferred_distance)/transition_length).
      a_max: 0.15  # m/s^2; bound on radial scalar, excluding drag/external fields
      transition_length: 0.15  # m; transition width; local slope is a_max/length
      preferred_distance: 1.0  # m
      damping: 0.5  # s^-1
      distance_epsilon: 1.0e-6  # m
