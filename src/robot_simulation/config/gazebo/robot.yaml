# Simulation deployment settings. Physical geometry and limits stay in robot_description.
robot:
  description:
    package: robot_description
    xacro: urdf/robot.urdf.xacro
    config: config/robot/robot.yaml
  entity_name: robot
  # Base center is wheel_radius - wheels.z_offset above the flat ground.
  pose: [0.0, 0.0, 0.25, 0.0, 0.0, 0.0]
  joint_name_template: '{key}_joint'
  joint_position_topic_template: '/model/{model}/joint/{joint}/cmd_pos'
  joint_states:
    topic: /joint_states
  # Physical world pose for diagnostics only; never routed into Control/Estimation.
  ground_truth_odometry:
    enabled: false
    dimensions: 3
    rate_hz: 20.0
    frame_id: world
    child_frame_id: base_link
    topic: /simulation/robot/ground_truth
    tf_topic: /simulation/robot/ground_truth_tf
  differential_drive:
    enabled: true
    left_joints: [front_left_wheel_joint, rear_left_wheel_joint]
    right_joints: [front_right_wheel_joint, rear_right_wheel_joint]
    rate_hz: 50.0
    topic: /simulation/robot/cmd_vel
    odom_topic: /wheel/odometry
    frame_id: odom
    child_frame_id: base_link
