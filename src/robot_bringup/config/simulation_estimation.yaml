# Deployment calibration: Gazebo encoder/odometry streams have no added noise.
# Conservative numerical uncertainty: 1 mm/s, 1 mrad/s, 1 mrad joint resolution.
# Actual sensor noise, target measurement noise and generic EKF defaults unchanged.
wheel_linear_velocity_variance: 0.000001
wheel_angular_velocity_variance: 0.000001
joint_position_variance: 0.000001
joint_velocity_variance: 0.000001
# The moving scenario accelerates substantially within the filter's one-second
# memory. Recorded-path replay selected this process prior with sensor R unchanged.
target_acceleration_noise_std: 0.5
full_state_publish_rate: 50.0
diagnostic_log_period: 5.0
