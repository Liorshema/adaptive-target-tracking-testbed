[develop]
script_dir=$base/lib/robot_control

[install]
install_scripts=$base/lib/robot_control

[isort]
profile = black
line_length = 79
known_first_party = robot_control
known_third_party = robot_models,robot_bringup

[flake8]
max-line-length = 99
extend-ignore = I100,I201,Q000
exclude = .git,__pycache__,build,install,log

[pydocstyle]
convention = google