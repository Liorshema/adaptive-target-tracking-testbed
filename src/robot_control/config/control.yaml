controllers:
  jacobian:
    parameters:
      gains:
      - 1.0
      - 1.0
      - 1.0
      damping: 1.0
  weighted_least_squares:
    parameters:
      gains:
      - 1.0
      - 3.0
      - 3.0
      task_weights:
      - 4.0
      - 12.0
      - 12.0
      task_scales:
      - 1.0
      - 1.0
      - 1.0
      motion_weights:
      - 1.0
      - 2.0
      - 3.0
      - 3.0
      - 3.0
      - 2.0
      damping: 0.08
      posture_weight: 0.01
      posture_gain: 0.3
      smoothness_weight: 0.005
      limit_avoidance_weight: 0.002
tasks:
  cartesian:
    parameters:
      axes:
      - 0
      - 1
      - 2
  distance_pointing:
    parameters:
      minimum_distance: 0.001
      antipodal_tolerance: 1.0e-05
tracking:
  parameters:
    radius: 1.0
    forward_axis_local:
    - 1.0
    - 0.0
    - 0.0
    up_axis_local:
    - 0.0
    - -1.0
    - 0.0
    world_up:
    - 0.0
    - 0.0
    - 1.0
    lookahead_time: 0.0
  distance_pointing:
    lookahead_time: 0.25
    prediction_sampling: linear
    target_velocity_feedforward: true
references:
  radial:
    parameters:
      epsilon: 1.0e-09
operating_bounds:
  base_velocity_lower:
  - -0.5
  - -1.0
  base_velocity_upper:
  - 0.5
  - 1.0
transport:
  joint_count: 4
  robot_state_topic: /estimation/robot_state_full
  prediction_topic: /prediction/trajectory
  command_topic: /control/safe_velocity
  command_frame_id: base_link
  command_joint_names: []
  telemetry_topic: /control/telemetry
  strategy_config_file: ''
  strategy_configuration: ''
  robot_description_file: ''
  feedforward_override: ''
  lookahead_override: ''
runtime:
  max_robot_state_age: 0.2
  max_prediction_age: 0.5
  future_tolerance: 0.01
  validation_rate: 20.0
  compute_enabled: true
  publish_commands: false
  safety_enabled: true
  publish_telemetry: false
