# Rejected experimental candidate: elbow/wrist physical overspeed and pointing
# failed validation. Keep the original allocation for the selected experiment.
# Control consumes plain YAML; a regression verifies that only base costs differ.
controller:
  type: weighted_least_squares
  uses_safety_bounds: true
  task:
    type: distance_pointing
    parameters:
      minimum_distance: 0.001
      antipodal_tolerance: 0.00001
  parameters:
    gains: [1.0, 3.0, 3.0]
    task_weights: [4.0, 12.0, 12.0]
    task_scales: [1.0, 1.0, 1.0]
    motion_weights: [3.0, 4.0, 3.0, 3.0, 3.0, 2.0]
    damping: 0.08
    posture_weight: 0.01
    posture_gain: 0.3
    smoothness_weight: 0.005
    limit_avoidance_weight: 0.002
tracking:
  lookahead_time: 0.25
  prediction_sampling: linear
  target_velocity_feedforward: true
